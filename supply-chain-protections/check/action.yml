name: Supply-chain policy check
description: Inventories a repository and evaluates supply-chain policies

inputs:
  fail-on-warn:
    description: Fail when policy warnings are produced
    default: "false"
  path:
    description: The path to the target folder that should be scanned
    default: "."

outputs:
  sarif:
    description: Generated SARIF report
    value: ${{ steps.evaluate.outputs.sarif }}
  exit_code:
    description: Conftest exit code
    value: ${{ steps.evaluate.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Generate repository inventory
      id: inventory
      uses: $/supply-chain-protections/inventory
      with:
        root: ${{ inputs.path != '.' && inputs.path || github.workspace }}
        repository: ${{ github.repository }}
        output: ${{ runner.temp }}/supply-chain-inventory.json

    - name: Print repository inventory
      shell: bash
      env:
        INVENTORY: ${{ steps.inventory.outputs.inventory }}
      run: |
        echo "::group::Repository inventory"
        cat "$INVENTORY"
        echo
        echo "::endgroup::"

    - name: Install Conftest
      shell: bash
      env:
        CONFTEST_VERSION: 0.69.0
        CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/conftest.tar.gz"
        bin_dir="$RUNNER_TEMP/conftest-bin"

        curl --fail --location --silent --show-error \
          "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
          --output "$archive"

        if ! printf '%s %s\n' "$CONFTEST_SHA256" "$archive" | sha256sum --check --status -; then
          echo "::error::Conftest checksum verification failed"
          exit 1
        fi

        mkdir -p "$bin_dir"
        tar -xzf "$archive" -C "$bin_dir" conftest
        printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

    - name: Evaluate policy
      id: evaluate
      shell: bash
      env:
        INVENTORY: ${{ steps.inventory.outputs.inventory }}
        FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        POLICY_VERSION: "v1"
      run: |
        set -euo pipefail

        policy_root="$RUNNER_TEMP/supply-chain-policy"

        curl --fail --location --silent --show-error \
          "https://github.com/bcc-code/bcc-security-scan/archive/refs/heads/policy-$POLICY_VERSION.tar.gz" \
          --output "$RUNNER_TEMP/policy.tar.gz"

        mkdir -p "$policy_root"
        tar -xzf "$RUNNER_TEMP/policy.tar.gz" \
          --strip-components=2 \
          -C "$policy_root" \
          "bcc-security-scan-policy-$POLICY_VERSION/supply-chain-protections"

        sarif="$RUNNER_TEMP/supply-chain-results.sarif"

        # --github-hide-passed should be added when conftest 0.70.0 is released or newer
        args=(
          test "$INVENTORY"
          --policy "$policy_root"
          --namespace "supply_chain.*"
          --output sarif
          --show-builtin-errors
        )

        if [[ "$FAIL_ON_WARN" == "true" ]]; then
          args+=(--fail-on-warn)
        fi

        set +e
        conftest "${args[@]}" > "$sarif"
        exit_code=$?
        set -e

        {
          echo "sarif=$sarif"
          echo "exit_code=$exit_code"
        } >> "$GITHUB_OUTPUT"

        scanned_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
        echo "### Supply-chain policy findings" >> "$GITHUB_STEP_SUMMARY"

        unpinned_total="$(jq '[
          .runs[].results[]
          | select(.level != "none")
          | select(.message.text | endswith("must use a full 40-character commit SHA"))
        ] | length' "$sarif")"
        unpinned_seen=0
        unpinned_summary=()

        while IFS= read -r result; do
          level="$(jq -r '.level // "warning"' <<< "$result")"
          file="$(jq -r \
            '.locations[0].physicalLocation.artifactLocation.uri // empty' \
            <<< "$result")"
          line="$(jq -r \
            '.locations[0].physicalLocation.region.startLine // 1' \
            <<< "$result")"
          message="$(jq -r '.message.text' <<< "$result")"

          case "$level" in
            error) annotation="error" ;;
            warning) annotation="warning" ;;
            note) annotation="notice" ;;
            *) continue ;;
          esac

          is_unpinned=false
          if [[ "$message" == *"must use a full 40-character commit SHA" ]]; then
            is_unpinned=true
            unpinned_seen=$((unpinned_seen + 1))
          fi

          escaped_file="${file//'%'/'%25'}"
          escaped_file="${escaped_file//$'\r'/'%0D'}"
          escaped_file="${escaped_file//$'\n'/'%0A'}"
          escaped_file="${escaped_file//':'/'%3A'}"
          escaped_file="${escaped_file//','/'%2C'}"

          escaped_message="${message//'%'/'%25'}"
          escaped_message="${escaped_message//$'\r'/'%0D'}"
          escaped_message="${escaped_message//$'\n'/'%0A'}"

          if [[ "$is_unpinned" == "false" || "$unpinned_total" -le 7 || "$unpinned_seen" -le 3 ]]; then
            printf '::%s file=%s,line=%s::%s\n' \
              "$annotation" "$escaped_file" "$line" "$escaped_message"
          fi

          encoded_file="$(jq -rn --arg path "$file" \
            '$path | split("/") | map(@uri) | join("/")')"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$scanned_sha/$encoded_file#L$line"

          if [[ "$is_unpinned" == "true" ]]; then
            printf -v summary_line -- '- [%s#L%s](%s): %s' \
              "$file" "$line" "$url" "$message"
            unpinned_summary+=("$summary_line")
          else
            printf -- '- [%s#L%s](%s): %s\n' \
              "$file" "$line" "$url" "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
        done < <(
          jq -c '.runs[].results[] | select(.level != "none")' "$sarif"
        )

        if [[ "$unpinned_total" -gt 0 ]]; then
          {
            printf '\n<details>\n'
            printf '<summary>Unpinned workflow dependencies (%s)</summary>\n\n' \
              "$unpinned_total"
            printf '%s\n' "${unpinned_summary[@]}"
            printf '\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
