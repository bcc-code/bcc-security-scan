name: Draft release

run-name: Draft ${{ inputs.bump }} release by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release-notes:
        description: Release notes
        required: true
        type: string

permissions: {}

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Build and test
        working-directory: supply-chain-protections/inventory
        run: |
          set -euo pipefail

          corepack enable
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

          if [[ -n "$(git status --porcelain -- dist)" ]]; then
            echo "::error::dist/index.js is not up to date or not committed"
            git status --short -- dist
            exit 1
          fi

      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest="$(
            {
              git tag --list
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[].tag_name'
            } |
              awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' |
              sort -Vu |
              tail -n 1
          )"

          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          tag="v${major}.${minor}.${patch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing draft release $tag"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          release_url="$(
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --fail-on-no-commits
          )"

          printf 'Draft release: [%s](%s)\n' \
            "$TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"